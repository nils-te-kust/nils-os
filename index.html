<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nils OS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f0f0f;color:#f0f0f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;height:100vh;overflow:hidden}
button{font-family:inherit;font-size:13px;cursor:pointer;border:1px solid #333;background:#1a1a1a;color:#f0f0f0;border-radius:6px;padding:6px 12px;transition:all .15s}
button:hover{background:#242424}
button.primary{background:#e8a020;color:#000;border-color:#e8a020;font-weight:500}
input,textarea,select{font-family:inherit;font-size:13px;background:#1a1a1a;color:#f0f0f0;border:1px solid #2a2a2a;border-radius:6px;padding:7px 10px;outline:none;width:100%;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:#e8a020}
select option{background:#1a1a1a}
#app{display:flex;height:100vh}
#sidebar{width:190px;flex-shrink:0;background:#0a0a0a;border-right:1px solid #1e1e1e;display:flex;flex-direction:column;padding:0}
#logo{padding:16px;border-bottom:1px solid #1e1e1e}
#logo h1{font-size:15px;font-weight:600}
#logo p{font-size:11px;color:#444;margin-top:2px}
.nav{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:13px;color:#666;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;border-right:2px solid transparent}
.nav:hover{color:#f0f0f0;background:#141414}
.nav.on{color:#e8a020;background:rgba(232,160,32,.07);border-right-color:#e8a020}
#main{flex:1;overflow:hidden;display:flex;flex-direction:column}
#topbar{padding:13px 22px;border-bottom:1px solid #1e1e1e;background:#0a0a0a;flex-shrink:0}
#topbar h2{font-size:15px;font-weight:500}
#topbar p{font-size:11px;color:#444;margin-top:2px}
#view{flex:1;overflow-y:auto;padding:22px}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:16px}
.label{font-size:11px;color:#555;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;font-weight:500}
.alert{border-radius:6px;padding:10px 14px;font-size:13px;line-height:1.55;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.alert.red{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.alert.amber{background:rgba(232,160,32,.07);border:1px solid rgba(232,160,32,.2);color:#fcd34d}
.alert.green{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.2);color:#86efac}
.alert.blue{background:rgba(59,130,246,.07);border:1px solid rgba(59,130,246,.2);color:#93c5fd}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* TODAY */
.brow{display:grid;grid-template-columns:76px 1fr;gap:10px;margin-bottom:5px;align-items:start}
.btime{font-size:11px;font-weight:500;padding-top:3px}
.bcard{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;padding:9px 12px}
.blabel{font-size:13px;font-weight:500;margin-bottom:2px}
.bnote{font-size:11px;color:#555;line-height:1.4;margin-bottom:5px}
.btask{display:flex;gap:6px;margin-top:5px}
.btask input{flex:1;font-size:12px}
.btask select{width:105px;font-size:11px}
/* WEEK */
.wcal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}
.wday{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:9px 6px;cursor:pointer;min-height:100px;transition:border-color .15s}
.wday:hover{border-color:#333}
.wday.today{border-color:#e8a020;background:rgba(232,160,32,.04)}
.wdname{font-size:10px;color:#444;text-align:center;margin-bottom:2px}
.wdnum{font-size:14px;font-weight:500;text-align:center;margin-bottom:5px}
.wpill{font-size:9px;padding:2px 4px;border-radius:3px;margin-bottom:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hrow{display:grid;grid-template-columns:190px repeat(7,1fr);gap:4px;align-items:center;margin-bottom:4px}
.hlabel{font-size:11px;color:#666}
.hdot{height:22px;border-radius:4px;background:#1a1a1a;border:1px solid #2a2a2a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s}
.hdot.on{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.3);color:#4ade80}
/* HABITS */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hitem{padding:9px 12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;font-size:12px;color:#666;display:flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.hitem.on{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.2);color:#86efac}
/* CHAT */
#chatview{display:flex;flex-direction:column;height:calc(100vh - 62px)}
#msgs{flex:1;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.65}
.msg.user{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:#bfdbfe;align-self:flex-end}
.msg.ai{background:#1a1a1a;border:1px solid #2a2a2a;color:#f0f0f0;align-self:flex-start;white-space:pre-wrap}
.msg.thinking{color:#444;font-style:italic;font-size:13px;align-self:flex-start}
#cinput{padding:14px 22px;border-top:1px solid #1e1e1e;display:flex;gap:8px;flex-shrink:0}
#cinput textarea{resize:none;height:42px;line-height:1.4}
/* TASKS */
.titem{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:6px;margin-bottom:5px}
.titem.done{opacity:.45}
.tcb{width:17px;height:17px;border-radius:50%;border:1px solid #333;background:transparent;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:10px}
.tcb.on{background:#22c55e;border-color:#22c55e;color:#000}
/* ROADMAP */
.rphase{margin-bottom:18px}
.rhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:6px;cursor:pointer;user-select:none}
.rbody{display:none;margin-top:6px}
.rbody.open{display:block}
.rtrack{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:12px 14px;margin-bottom:6px}
.rstep{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #1e1e1e;font-size:13px;color:#888;line-height:1.5}
.rstep:last-child{border:none}
.rnum{font-size:11px;color:#444;min-width:18px;padding-top:1px}
/* SCHEDULE */
.sched{width:100%;border-collapse:collapse}
.sched th{font-size:11px;color:#444;font-weight:500;text-align:left;padding:6px 10px;border-bottom:1px solid #1e1e1e}
.sched td{padding:8px 10px;border-bottom:1px solid #1a1a1a;font-size:13px;vertical-align:top}
.sched tr:hover td{background:#141414}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="logo"><h1>Nils OS</h1><p id="sdate"></p></div>
    <button class="nav on" onclick="go('today')">◉ Today</button>
    <button class="nav" onclick="go('week')">▦ Week</button>
    <button class="nav" onclick="go('schedule')">⏱ Schedule</button>
    <button class="nav" onclick="go('roadmap')">↗ Roadmap</button>
    <button class="nav" onclick="go('tasks')">☑ Tasks</button>
    <button class="nav" onclick="go('journal')">✎ Journal</button>
    <button class="nav" onclick="go('chat')">◈ Assistant</button>
    <a class="nav" href="truemirror.html" style="text-decoration:none">◐ True Mirror</a>
    <button class="nav" onclick="go('settings')" style="margin-top:auto">⚙ Settings</button>
  </div>
  <div id="main">
    <div id="topbar"><h2 id="ttitle">Today</h2><p id="tmeta"></p></div>
    <div id="view"></div>
  </div>
</div>

<script>
// ── helpers ──────────────────────────────────────────────────────────
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl2br(s){ return esc(s).replace(/\n/g,'<br>'); }
function ls(k,d){ try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;} }
function lset(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function today(){ return new Date().toISOString().split('T')[0]; }
function weekDays(off){
  var d=new Date(),day=d.getDay()||7;
  d.setDate(d.getDate()-day+1+(off||0)*7);
  return [0,1,2,3,4,5,6].map(function(i){var x=new Date(d);x.setDate(d.getDate()+i);return x;});
}
function fmt(d){ return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function nowTime(){ var n=new Date();return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0'); }

// ── config ────────────────────────────────────────────────────────────
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var TRACKS=['','PhotoPARK','Luminati','Kastekust','Personal brand','Admin'];
var TC={'PhotoPARK':'#4ade80','Luminati':'#60a5fa','Kastekust':'#fb923c','Personal brand':'#a3a3a3','Admin':'#f87171','':'#555'};
var TB={'PhotoPARK':'rgba(20,83,45,.6)','Luminati':'rgba(30,58,95,.6)','Kastekust':'rgba(69,26,3,.6)','Personal brand':'rgba(40,40,40,.6)','Admin':'rgba(63,15,15,.6)','':'rgba(26,26,26,.6)'};

var BLOCKS=[
  {t:'05:30',l:'Wake & prime',n:'Write one goal. Phone face down.',e:false,type:'f'},
  {t:'06:30',l:'CrossFit',n:'Non-negotiable. Already locked.',e:false,type:'g'},
  {t:'08:30',l:'Recovery & fuel',n:'Eat, shower. No work yet.',e:false,type:'f'},
  {t:'09:15',l:'Strategic block',n:'PHONE IN ANOTHER ROOM. One pre-decided task only.',e:true,type:'r'},
  {t:'11:30',l:'Sales & outreach',n:'Calls, follow-ups, Nordic outreach.',e:true,type:'n'},
  {t:'13:00',l:'Lunch & reset',n:'Away from screen. Walk if possible.',e:false,type:'f'},
  {t:'14:00',l:'Projects & ops',n:'Kastekust, client work, coordination.',e:true,type:'n'},
  {t:'16:30',l:'Wrap & plan tomorrow',n:'Write tomorrow\'s tasks NOW. Kills procrastination.',e:true,type:'a'},
  {t:'19:00',l:'Evening',n:'Personal time. Protect it.',e:false,type:'f'},
  {t:'22:00',l:'Wind down',n:'Screen off by 22:30.',e:false,type:'f'},
];

var HABITS=[
  {id:'ns',l:'No phone in strategic block'},
  {id:'gl',l:'One goal written at 05:30'},
  {id:'cf',l:'CrossFit done'},
  {id:'ln',l:'Lunch away from screen'},
  {id:'wp',l:'Tomorrow planned before close'},
  {id:'sl',l:'Screen off by 22:30'},
];

var SCHED=[
  {day:'Mon / Wed',time:'09:15–11:30',track:'PhotoPARK',task:'Pitch deck & demo tool. One deliverable pre-decided night before.',c:'#4ade80'},
  {day:'Tue / Thu',time:'09:15–11:30',track:'Luminati',task:'Presets, tester outreach, feedback loop, content.',c:'#60a5fa'},
  {day:'Fri',time:'09:15–11:30',track:'Review',task:'Weekly review. What moved? Plan next week\'s blocks.',c:'#a855f7'},
  {day:'Mon–Fri',time:'11:30–13:00',track:'Sales',task:'Nordic outreach, Kastekust proposals, client calls.',c:'#f59e0b'},
  {day:'Mon–Fri',time:'14:00–16:30',track:'Kastekust',task:'ALL event ops, inquiries, project management, freelancers.',c:'#fb923c'},
  {day:'Mon–Fri',time:'16:30–17:00',track:'Wrap',task:'Plan tomorrow\'s tasks. This kills morning procrastination.',c:'#666'},
  {day:'Sat',time:'Morning',track:'Luminati',task:'Deeper build work. No client interruptions.',c:'#60a5fa'},
  {day:'Sun',time:'Morning',track:'Rest',task:'Recovery. Read. Optional: think, not do.',c:'#333'},
];

var ROADMAP=[
  {phase:'Now — 4 weeks',c:'#e8a020',bg:'rgba(232,160,32,.07)',tracks:[
    {n:'PhotoPARK',c:'#4ade80',steps:['Cinema gig ends → book VEF meeting within 48hrs','Build pitch deck: experience → tech → market → deal → founder','Build AR demo so VEF feels the magic viewpoint concept','Disclose debt + COO situation proactively — frame as why deal structure makes sense','Model winter/low-season revenue — VEF will ask']},
    {n:'Luminati',c:'#60a5fa',steps:['Build 12–15 named presets using your 20yr lighting knowledge','Fix mixed currency — pick EUR throughout','Cap lifetime deal at 200 units on pricing page','Add ToS & Privacy Policy via iubenda.com — one afternoon','Message 3 of the 50 Filipino testers personally today','Add feedback buttons (perfect/close/wrong) to every render']},
    {n:'Kastekust',c:'#fb923c',steps:['List every confirmed, in-conversation, potential summer booking','Deliver every booked event at full quality','Contact 2–3 corporate clients about annual agreements','Find one part-time accountant for tax & finance admin']},
    {n:'Foundation',c:'#a855f7',steps:['Continue therapy. Non-negotiable.','Protect 09:15 block every day. Phone in another room.','One goal written every morning. One reflection every evening.']},
  ]},
  {phase:'Month 2–4',c:'#3b82f6',bg:'rgba(59,130,246,.07)',tracks:[
    {n:'PhotoPARK',c:'#4ade80',steps:['VEF deal signed or go/no-go. No limbo.','If yes: AR tech build begins. COO onboarded from VEF side.','First revenue model validated — corporate + tourism']},
    {n:'Luminati',c:'#60a5fa',steps:['Target 50 paying users across Philippines, India, Brazil','Implement rejection sampling — run 2–3 variations silently, show best','Publish MRR publicly — builds acquirer credibility','Find one ML engineer to consult on training layer','Log every render as future training data']},
    {n:'Kastekust',c:'#fb923c',steps:['Summer closes. Pay what you can on debt.','2–3 annual agreements signed with corporate clients','No new service investments — cash engine only']},
  ]},
  {phase:'Month 4–8',c:'#22c55e',bg:'rgba(34,197,94,.07)',tracks:[
    {n:'PhotoPARK',c:'#4ade80',steps:['Physical build underway. AR tech v1 in development.','First test experiences with photographers and press','SaaS licensing conversations with museums and tourism internationally']},
    {n:'Luminati',c:'#60a5fa',steps:['100+ paying users. MRR visible and growing.','Begin training proprietary correction layer from logged data','File patent on no-prompt lighting interface concept']},
    {n:'Nils Vilnis',c:'#a3a3a3',steps:['Speaking at one photography or creative tech event','Visible in Nordic and European creative circles']},
  ]},
  {phase:'Month 8–18 — Exit window',c:'#a855f7',bg:'rgba(168,85,247,.07)',tracks:[
    {n:'PhotoPARK',c:'#4ade80',steps:['Park open. Revenue from consumer, corporate, events.','You are creative director — not operations manager.','SaaS licensing pipeline active internationally']},
    {n:'Luminati exit',c:'#60a5fa',steps:['Product Hunt launch. Photography press coverage.','Proprietary model + dataset documented as IP','Connect with M&A advisor — success fee only','Target: €500K–€2M acquisition — Adobe, Luminar, Capture One, Canva']},
    {n:'Nils Vilnis',c:'#a3a3a3',steps:['Known name outside Latvia. European agencies find you.','Courses live. Speaking. Consulting.','Creating from stability — not survival.']},
  ]},
];

var SYS='You are Nils Vilnis\'s personal business coach embedded in his OS. You know everything about him.\n\nNils: 20+ year advertising/portrait photographer, Riga Latvia. Runs Kastekust.lv — custom photobooths, AI activations, LED wall studio. Clients: Swedbank, SEB, Red Bull, LMT, Bite, Philip Morris.\n\nSituation: ~€100K debt (€70K ALTUM business, €30K private). Previous COO left and sued him. LED studio closed. In therapy. Starting to rebuild.\n\nProjects:\n1. PhotoPARK (PRIORITY #1) — First immersive cinematic park in Baltics. 400m² at VEF Kvartāls. Forced perspective sets + 3x6m LED volume + proprietary AR anamorphic platform. AI post-production. VEF interested investor. Deal: €225K (€70K clears ALTUM debt, rest funds build + salary €3-5K/month + COO from VEF side). AR tech still needs building.\n2. Luminati (luminati.app) — AI lighting tool for photographers. No prompts needed. Gemini-powered. Payment live. ~50 Filipino testers. Exit goal: sell to Adobe/Luminar for €500K–€2M.\n3. Kastekust events — Cash engine. Freelance team. Summer season now. Afternoons only (14:00–16:30).\n4. Nils Vilnis personal brand — International positioning. One post/week.\n\nDaily structure: 05:30 wake, 06:30-08:30 CrossFit, 09:15-11:30 strategic block (Mon/Wed=PhotoPARK, Tue/Thu=Luminati, Fri=review), 11:30-13:00 sales, 14:00-16:30 Kastekust ops, 16:30 wrap.\n\nPersonality: Artistic, visionary, struggles with operations. Anxiety. Scrolls phone during work. Procrastinates by opening task then drifting. CrossFit every day = proof of discipline.\n\nBe direct, practical, short. No fluff. Use his context. Ground him in next action when anxious.';

// ── state ─────────────────────────────────────────────────────────────
var view='today';
var woff=0;
var openPhase=0;

function getDayData(dk){
  var all=ls('wd',{});
  if(!all[dk]){
    all[dk]={h:{},t:{}};
    BLOCKS.forEach(function(b){all[dk].t[b.t]={tx:'',tr:''};});
    lset('wd',all);
  }
  return all;
}
function saveDayData(all){ lset('wd',all); }
function getGoals(){ return ls('goals',{}); }
function getTasks(){ return ls('tasks',[]); }
function getJournals(){ return ls('jrnl',{}); }
function getChat(){ return ls('chat',[]); }
function getSettings(){ return ls('cfg',{apiKey:'',tgToken:'',tgChatId:''}); }
function habitScore(dk){
  var all=getDayData(dk);
  var h=all[dk].h||{};
  return HABITS.filter(function(x){return h[x.id];}).length;
}
function currentBlock(){
  var n=new Date(),mins=n.getHours()*60+n.getMinutes();
  function tm(s){var p=s.split(':');return parseInt(p[0])*60+parseInt(p[1]);}
  for(var i=0;i<BLOCKS.length;i++){
    var end=i+1<BLOCKS.length?tm(BLOCKS[i+1].t):1440;
    if(mins>=tm(BLOCKS[i].t)&&mins<end)return BLOCKS[i].t;
  }
  return null;
}

// ── nav ───────────────────────────────────────────────────────────────
function go(v){
  view=v;
  document.querySelectorAll('.nav').forEach(function(el){el.classList.remove('on');});
  var btns=document.querySelectorAll('.nav');
  var labels={today:'◉ Today',week:'▦ Week',schedule:'⏱ Schedule',roadmap:'↗ Roadmap',tasks:'☑ Tasks',journal:'✎ Journal',chat:'◈ Assistant',settings:'⚙ Settings'};
  btns.forEach(function(b){if(b.textContent.trim()===labels[v].trim())b.classList.add('on');});
  var titles={today:'Today',week:'Week',schedule:'Weekly schedule',roadmap:'Roadmap',tasks:'Tasks',journal:'Journal',chat:'Assistant',settings:'Settings'};
  document.getElementById('ttitle').textContent=titles[v]||v;
  document.getElementById('tmeta').textContent=v==='today'?fmt(new Date()):'';
  render();
}

// ── render ────────────────────────────────────────────────────────────
function render(){
  var el=document.getElementById('view');
  var fns={today:rToday,week:rWeek,schedule:rSched,roadmap:rRoadmap,tasks:rTasks,journal:rJournal,chat:rChat,settings:rSettings};
  el.innerHTML=(fns[view]||rToday)();
  if(view==='chat')setTimeout(function(){var e=document.getElementById('cend');if(e)e.scrollIntoView({behavior:'instant'});},30);
}

// ── TODAY ─────────────────────────────────────────────────────────────
function rToday(){
  var dk=today();
  var all=getDayData(dk);
  var d=all[dk];
  var goals=getGoals();
  var goal=goals[dk]||'';
  var cur=currentBlock();
  var tod=new Date();
  var dn=tod.toLocaleDateString('en-GB',{weekday:'long'});
  var focus=dn==='Monday'||dn==='Wednesday'?'PhotoPARK':dn==='Tuesday'||dn==='Thursday'?'Luminati':dn==='Friday'?'Weekly review':'—';
  var score=habitScore(dk);
  var sm=score===6?'Perfect day ✦':score>=4?'Strong day':score>=2?'Building...':'Start with one';
  var sc=score===6?'#4ade80':score>=4?'#60a5fa':score>=2?'#f59e0b':'#444';

  var blocks=BLOCKS.map(function(bl){
    var tv=d.t[bl.t]||{tx:'',tr:''};
    var isCur=bl.t===cur;
    var bc=bl.type==='r'?'rgba(239,68,68,.35)':bl.type==='a'?'rgba(232,160,32,.35)':bl.type==='g'?'rgba(34,197,94,.35)':isCur?'rgba(59,130,246,.35)':'#2a2a2a';
    var bg=bl.type==='r'?'rgba(239,68,68,.04)':bl.type==='a'?'rgba(232,160,32,.04)':bl.type==='g'?'rgba(34,197,94,.04)':isCur?'rgba(59,130,246,.04)':'#1a1a1a';
    var tc2=bl.type==='r'?'#f87171':bl.type==='a'?'#fcd34d':bl.type==='g'?'#4ade80':isCur?'#93c5fd':'#555';
    var badge=bl.type==='r'?'<span style="font-size:10px;background:rgba(239,68,68,.1);color:#f87171;padding:1px 7px;border-radius:10px;margin-left:6px;">📵 phone out</span>':isCur?'<span style="font-size:10px;background:rgba(59,130,246,.1);color:#93c5fd;padding:1px 7px;border-radius:10px;margin-left:6px;">● now</span>':'';
    var taskHtml='';
    if(bl.e){
      var tsel=TRACKS.map(function(tr){return '<option value="'+esc(tr)+'"'+(tv.tr===tr?' selected':'')+'>'+esc(tr||'No track')+'</option>';}).join('');
      taskHtml='<div class="btask"><input value="'+esc(tv.tx)+'" onchange="setTask(\''+dk+'\',\''+bl.t+'\',\'tx\',this.value)" placeholder="'+(bl.type==='a'?'Write tomorrow\'s tasks...':'Task for this block...')+'" /><select onchange="setTask(\''+dk+'\',\''+bl.t+'\',\'tr\',this.value)" style="background:'+TB[tv.tr]+';color:'+TC[tv.tr]+'">'+tsel+'</select></div>';
    }
    return '<div class="brow"><div class="btime" style="color:'+tc2+'">'+esc(bl.t)+'</div><div class="bcard" style="border-color:'+bc+';background:'+bg+'"><div class="blabel">'+esc(bl.l)+badge+'</div><div class="bnote">'+esc(bl.n)+'</div>'+(tv.tx?'<div style="font-size:11px;margin-bottom:4px;"><span style="background:'+TB[tv.tr]+';color:'+TC[tv.tr]+';padding:2px 7px;border-radius:3px;font-size:10px;">'+esc(tv.tr||'task')+': '+esc(tv.tx)+'</span></div>':'')+taskHtml+'</div></div>';
  }).join('');

  var habs=HABITS.map(function(h){
    var on=d.h[h.id];
    return '<div class="hitem'+(on?' on':'')+'" onclick="toggleHabit(\''+dk+'\',\''+h.id+'\')">'+(on?'✓':'○')+' '+esc(h.l)+'</div>';
  }).join('');

  return '<div class="alert red"><span>📵</span><span><b>09:15–11:30:</b> Phone in another room. Today\'s strategic focus: <b>'+esc(focus)+'</b></span></div>'
    +'<div style="margin-bottom:18px;"><div class="label">Today\'s one goal</div><input value="'+esc(goal)+'" onchange="setGoal(\''+dk+'\',this.value)" placeholder="What makes today a win?" style="font-size:15px;font-weight:500;padding:11px 13px;" /></div>'
    +'<div style="margin-bottom:22px;"><div class="label">Time blocks</div>'+blocks+'</div>'
    +'<div><div class="label">Habits — '+score+'/'+HABITS.length+' <span style="color:'+sc+'">'+esc(sm)+'</span></div><div class="hgrid">'+habs+'</div></div>';
}

function setTask(dk,t,field,val){
  var all=getDayData(dk);
  if(!all[dk].t[t])all[dk].t[t]={tx:'',tr:''};
  all[dk].t[t][field]=val;
  saveDayData(all);
}
function setGoal(dk,val){
  var g=getGoals();g[dk]=val;lset('goals',g);
}
function toggleHabit(dk,hid){
  var all=getDayData(dk);
  all[dk].h[hid]=!all[dk].h[hid];
  saveDayData(all);
  render();
}

// ── WEEK ──────────────────────────────────────────────────────────────
function rWeek(){
  var days=weekDays(woff);
  var td=today();
  days.forEach(function(d){getDayData(d.toISOString().split('T')[0]);});
  var all=ls('wd',{});

  var cells=days.map(function(day,i){
    var dk=day.toISOString().split('T')[0];
    var isT=dk===td;
    var sc=habitScore(dk);
    var d=all[dk]||{t:{}};
    var pills=Object.values(d.t||{}).filter(function(v){return v.tx;}).slice(0,3).map(function(v){
      return '<div class="wpill" style="background:'+TB[v.tr]+';color:'+TC[v.tr]+'">'+esc(v.tx)+'</div>';
    }).join('');
    return '<div class="wday'+(isT?' today':'')+'" onclick="pickDay(\''+dk+'\')">'
      +'<div class="wdname">'+DAYS[i]+'</div>'
      +'<div class="wdnum" style="color:'+(isT?'#e8a020':'#f0f0f0')+'">'+day.getDate()+'</div>'
      +(sc?'<div style="text-align:center;margin-bottom:4px"><span style="font-size:9px;background:rgba(34,197,94,.1);color:#4ade80;padding:1px 6px;border-radius:10px;">'+sc+'/'+HABITS.length+'</span></div>':'')
      +pills+'</div>';
  }).join('');

  var wk=weekDays(woff);
  var wlabel=wk[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+wk[6].toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  var hrows=HABITS.map(function(h){
    var dots=days.map(function(day){
      var dk=day.toISOString().split('T')[0];
      var on=(all[dk]&&all[dk].h&&all[dk].h[h.id]);
      return '<div class="hdot'+(on?' on':'')+'" onclick="toggleWeekHabit(\''+dk+'\',\''+h.id+'\')">'+(on?'✓':'')+'</div>';
    }).join('');
    return '<div class="hrow"><div class="hlabel">'+esc(h.l)+'</div>'+dots+'</div>';
  }).join('');

  var dd=ls('selday','');
  var dayDetail='';
  if(dd){
    var dall=getDayData(dd);
    var dp=dall[dd]||{t:{}};
    var dday=new Date(dd);
    var df=BLOCKS.filter(function(b){return b.e;}).map(function(bl){
      var tv=dp.t[bl.t]||{tx:'',tr:''};
      var tsel=TRACKS.map(function(tr){return '<option value="'+esc(tr)+'"'+(tv.tr===tr?' selected':'')+'>'+esc(tr||'No track')+'</option>';}).join('');
      return '<div style="margin-bottom:9px"><div style="font-size:11px;color:#555;margin-bottom:4px">'+esc(bl.t)+' — '+esc(bl.l)+'</div><div style="display:flex;gap:6px"><input value="'+esc(tv.tx)+'" onchange="setTask(\''+dd+'\',\''+bl.t+'\',\'tx\',this.value)" placeholder="Task..." style="flex:1;font-size:12px" /><select onchange="setTask(\''+dd+'\',\''+bl.t+'\',\'tr\',this.value)" style="width:100px;font-size:11px;background:'+TB[tv.tr]+';color:'+TC[tv.tr]+'">'+tsel+'</select></div></div>';
    }).join('');
    dayDetail='<div class="card" style="margin-top:16px"><div style="font-size:14px;font-weight:500;margin-bottom:14px">'+fmt(dday)+'</div>'+df+'</div>';
  }

  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div style="font-size:13px;color:#555">'+esc(wlabel)+'</div><div style="display:flex;gap:6px"><button onclick="woff--;render()">‹</button><button onclick="woff=0;render()">This week</button><button onclick="woff++;render()">›</button></div></div>'
    +'<div class="wcal">'+cells+'</div>'
    +'<div class="label">Habit streak</div>'+hrows+dayDetail;
}

function pickDay(dk){
  var cur=ls('selday','');
  lset('selday',cur===dk?'':dk);
  render();
}
function toggleWeekHabit(dk,hid){
  var all=getDayData(dk);
  all[dk].h[hid]=!all[dk].h[hid];
  saveDayData(all);
  render();
}

// ── SCHEDULE ──────────────────────────────────────────────────────────
function rSched(){
  var rows=SCHED.map(function(r){
    return '<tr><td style="color:#666;font-size:12px">'+esc(r.day)+'</td><td style="color:#444;font-size:11px;font-family:monospace">'+esc(r.time)+'</td><td><span style="background:rgba(255,255,255,.05);color:'+r.c+';font-size:11px;padding:2px 8px;border-radius:10px;font-weight:500">'+esc(r.track)+'</span></td><td style="color:#888;font-size:13px">'+esc(r.task)+'</td></tr>';
  }).join('');
  return '<div class="alert amber"><b>Rule:</b> Kastekust ops live at 14:00–16:30 only. Mornings are protected for the future.</div>'
    +'<div class="alert red"><b>Anti-scroll:</b> 09:15–11:30 phone in another room. Task is pre-decided at 16:30 the night before.</div>'
    +'<div class="card"><table class="sched"><thead><tr><th>Day</th><th>Time</th><th>Track</th><th>Focus</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

// ── ROADMAP ───────────────────────────────────────────────────────────
function rRoadmap(){
  var phases=ROADMAP.map(function(ph,pi){
    var tracks=ph.tracks.map(function(tr){
      var steps=tr.steps.map(function(s,i){
        return '<div class="rstep"><div class="rnum">'+(i+1)+'</div><div>'+esc(s)+'</div></div>';
      }).join('');
      return '<div class="rtrack" style="border-left:3px solid '+tr.c+'"><div style="font-size:11px;font-weight:500;color:'+tr.c+';text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">'+esc(tr.n)+'</div>'+steps+'</div>';
    }).join('');
    return '<div class="rphase">'
      +'<div class="rhead" style="background:'+ph.bg+';border:1px solid rgba(255,255,255,.05)" onclick="togglePhase('+pi+')">'
      +'<span style="font-size:15px;font-weight:500;color:'+ph.c+'">'+esc(ph.phase)+'</span>'
      +'<span id="ra'+pi+'" style="margin-left:auto;color:'+ph.c+'">'+(pi===openPhase?'▼':'▶')+'</span>'
      +'</div>'
      +'<div class="rbody'+(pi===openPhase?' open':'')+'" id="rb'+pi+'">'+tracks+'</div>'
      +'</div>';
  }).join('');
  return '<div class="alert green" style="margin-bottom:18px"><b>North star:</b> PhotoPARK closes → debt cleared, salary live → you create from stability → Luminati exits → Nils Vilnis is known internationally.</div>'+phases;
}
function togglePhase(i){
  openPhase=openPhase===i?-1:i;
  render();
}

// ── TASKS ─────────────────────────────────────────────────────────────
function rTasks(){
  var tasks=getTasks();
  var pending=tasks.filter(function(t){return !t.done;});
  var done=tasks.filter(function(t){return t.done;});

  function titem(t){
    var tsel=TRACKS.filter(function(x){return x;}).map(function(tr){return '<option value="'+esc(tr)+'"'+(t.track===tr?' selected':'')+'>'+esc(tr)+'</option>';}).join('');
    return '<div class="titem'+(t.done?' done':'')+'">'
      +'<div class="tcb'+(t.done?' on':'')+'" onclick="togTask('+t.id+')">'+(t.done?'✓':'')+'</div>'
      +'<div style="flex:1;font-size:13px;line-height:1.4">'+esc(t.text)+'</div>'
      +'<span style="font-size:10px;background:'+TB[t.track]+';color:'+TC[t.track]+';padding:2px 7px;border-radius:3px;white-space:nowrap">'+esc(t.track||'—')+'</span>'
      +'<button onclick="delTask('+t.id+')" style="padding:2px 6px;border:none;background:transparent;color:#333;font-size:16px;line-height:1">×</button>'
      +'</div>';
  }

  var tsecs=TRACKS.filter(function(x){return x;}).map(function(tr){
    var ts=pending.filter(function(t){return t.track===tr;});
    if(!ts.length)return '';
    return '<div style="margin-bottom:14px"><div class="label" style="color:'+TC[tr]+'">'+esc(tr)+' ('+ts.length+')</div>'+ts.map(titem).join('')+'</div>';
  }).join('');
  var notr=pending.filter(function(t){return !t.track;});
  if(notr.length)tsecs+='<div style="margin-bottom:14px"><div class="label">Untracked</div>'+notr.map(titem).join('')+'</div>';
  if(done.length)tsecs+='<div style="margin-top:18px"><div class="label">Done ('+done.length+')</div>'+done.map(titem).join('')+'</div>';
  if(!tasks.length)tsecs='<div class="card" style="text-align:center;color:#444;padding:40px">No tasks yet.</div>';

  var tsel2=TRACKS.map(function(tr){return '<option value="'+esc(tr)+'">'+esc(tr||'No track')+'</option>';}).join('');
  return '<div style="display:flex;gap:8px;margin-bottom:20px"><input id="ni" placeholder="Add a task..." onkeydown="if(event.key===\'Enter\')addTask()" style="flex:1" /><select id="ntr" style="width:120px">'+tsel2+'</select><button class="primary" onclick="addTask()">Add</button></div>'+tsecs;
}
function addTask(){
  var i=document.getElementById('ni'),tr=document.getElementById('ntr');
  if(!i||!i.value.trim())return;
  var tasks=getTasks();
  tasks.push({id:Date.now(),text:i.value.trim(),track:tr?tr.value:'',done:false});
  i.value='';lset('tasks',tasks);render();
}
function togTask(id){
  var tasks=getTasks();
  tasks.forEach(function(t){if(t.id===id)t.done=!t.done;});
  lset('tasks',tasks);render();
}
function delTask(id){
  var tasks=getTasks().filter(function(t){return t.id!==id;});
  lset('tasks',tasks);render();
}

// ── JOURNAL ───────────────────────────────────────────────────────────
function rJournal(){
  var dk=today();
  var j=getJournals();
  var val=j[dk]||'';
  return '<div style="margin-bottom:10px;font-size:13px;color:#555">'+fmt(new Date())+'</div>'
    +'<textarea id="jarea" onchange="saveJ(\''+dk+'\',this.value)" style="width:100%;min-height:300px;font-size:14px;line-height:1.8;resize:vertical;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:10px;padding:16px" placeholder="Write freely.\n\nWhat happened? What moved? What do you want tomorrow to look like?">'+esc(val)+'</textarea>'
    +'<div style="display:flex;gap:8px;margin-top:10px"><button onclick="sendTg(\'📓 *Journal — '+dk+'*\\n\\n\'+document.getElementById(\'jarea\').value)">Send to Telegram</button></div>';
}
function saveJ(dk,val){var j=getJournals();j[dk]=val;lset('jrnl',j);}

// ── CHAT ──────────────────────────────────────────────────────────────
function rChat(){
  var chat=getChat();
  var msgs=chat.map(function(m){
    return '<div class="msg '+esc(m.role==='user'?'user':'ai')+'">'+nl2br(m.content)+'</div>';
  }).join('');
  var empty=!chat.length?'<div class="card" style="max-width:480px"><div style="font-size:15px;font-weight:500;margin-bottom:8px">Your personal assistant</div><div style="font-size:13px;color:#666;line-height:1.7">Your full context is pre-loaded — debt, PhotoPARK, Luminati, Kastekust, VEF, Nordic plan, daily structure, everything.<br><br>Ask anything. What to work on. How to pitch VEF. How to message a tester. What to post. How to handle an inquiry.</div></div>':'';
  return '<div id="chatview"><div id="msgs">'+empty+msgs+'<div id="cend"></div></div><div id="cinput"><textarea id="cin" placeholder="Ask... (Enter to send, Shift+Enter for new line)" onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();doChat();}"></textarea><button class="primary" onclick="doChat()" style="height:42px;padding:0 16px">Send</button></div></div>';
}

async function doChat(){
  var inp=document.getElementById('cin');
  if(!inp||!inp.value.trim())return;
  var msg=inp.value.trim();inp.value='';
  var cfg=getSettings();
  if(!cfg.apiKey){alert('Add your Anthropic API key in Settings first.');return;}
  var chat=getChat();
  chat.push({role:'user',content:msg});
  lset('chat',chat.slice(-60));
  render();
  setTimeout(function(){var e=document.getElementById('cend');if(e)e.scrollIntoView({behavior:'instant'});},30);

  var tm=document.createElement('div');
  tm.className='msg thinking';tm.textContent='Thinking...';
  var msgs=document.getElementById('msgs');
  if(msgs)msgs.appendChild(tm);

  try{
    var res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':cfg.apiKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',
        max_tokens:1000,
        system:SYS,
        messages:chat.map(function(m){return {role:m.role,content:m.content};})
      })
    });
    var data=await res.json();
    var reply='';
    if(data.content&&Array.isArray(data.content)){
      data.content.forEach(function(b){if(b.type==='text')reply+=b.text;});
    }
    if(!reply&&data.error)reply='API Error: '+data.error.message;
    if(!reply)reply='No response received.';
    chat.push({role:'assistant',content:reply});
    lset('chat',chat.slice(-60));
  }catch(e){
    chat.push({role:'assistant',content:'Connection error: '+e.message});
    lset('chat',chat.slice(-60));
  }
  render();
  setTimeout(function(){var e=document.getElementById('cend');if(e)e.scrollIntoView({behavior:'instant'});},50);
}

// ── SETTINGS ──────────────────────────────────────────────────────────
function rSettings(){
  var cfg=getSettings();
  return '<div style="max-width:500px;display:flex;flex-direction:column;gap:16px">'
    +'<div class="card"><div class="label">Anthropic API key</div><p style="font-size:12px;color:#555;margin-bottom:10px;line-height:1.6">Get at <a href="https://console.anthropic.com" target="_blank" style="color:#e8a020">console.anthropic.com</a>. Stored in your browser only.</p><input type="password" id="sak" value="'+esc(cfg.apiKey)+'" placeholder="sk-ant-..." style="margin-bottom:8px" /><button onclick="saveCfg()">Save</button></div>'
    +'<div class="card"><div class="label">Telegram</div><p style="font-size:12px;color:#555;margin-bottom:10px;line-height:1.7">1. Message <b>@BotFather</b> → /newbot → get token<br>2. Start your bot, message <b>@userinfobot</b> → get your chat ID</p><input id="stk" value="'+esc(cfg.tgToken)+'" placeholder="Bot token" style="margin-bottom:8px;font-size:12px" /><input id="sci" value="'+esc(cfg.tgChatId)+'" placeholder="Your chat ID" style="margin-bottom:8px;font-size:12px" /><div style="display:flex;gap:8px"><button onclick="saveCfg()">Save</button><button onclick="sendTg(\'👋 Nils OS connected and live.\')">Test</button></div></div>'
    +'<div class="card"><div class="label">Quick Telegram sends</div><div style="display:flex;flex-direction:column;gap:6px"><button style="text-align:left" onclick="sendTg(\'☀️ Morning. Goal: \'+(ls(\'goals\',{})[today()]||\'not set\')+\'\\nFocus: CrossFit → Strategic block.\')">Morning brief</button><button style="text-align:left" onclick="sendTg(\'🌙 End of day. Goal was: \'+(ls(\'goals\',{})[today()]||\'not set\')+\'\\nDid you deliver?\')">End of day</button></div></div>'
    +'<div class="card"><div class="label">Reset</div><button onclick="if(confirm(\'Clear chat history?\')){lset(\'chat\',[]);alert(\'Done.\');}">Clear chat history</button></div>'
    +'</div>';
}
function saveCfg(){
  var ak=document.getElementById('sak'),tk=document.getElementById('stk'),ci=document.getElementById('sci');
  lset('cfg',{apiKey:ak?ak.value:'',tgToken:tk?tk.value:'',tgChatId:ci?ci.value:''});
  alert('Saved.');
}
async function sendTg(msg){
  var cfg=getSettings();
  if(!cfg.tgToken||!cfg.tgChatId){alert('Add Telegram token & chat ID in Settings first.');return;}
  try{
    var r=await fetch('https://api.telegram.org/bot'+cfg.tgToken+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:cfg.tgChatId,text:msg,parse_mode:'Markdown'})});
    var d=await r.json();
    d.ok?alert('Sent ✓'):alert('Error: '+d.description);
  }catch(e){alert('Telegram failed: '+e.message);}
}

// ── init ──────────────────────────────────────────────────────────────
document.getElementById('sdate').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
document.getElementById('tmeta').textContent=fmt(new Date());
render();
</script>
