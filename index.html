<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nils OS</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: #2a2a2a;
    --border2: #333;
    --text: #f0f0f0;
    --text2: #999;
    --text3: #555;
    --accent: #e8a020;
    --green: #22c55e;
    --blue: #3b82f6;
    --red: #ef4444;
    --purple: #a855f7;
    --radius: 10px;
    --radius-sm: 6px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; min-height: 100vh; }
  button { font-family: var(--font); font-size: 13px; cursor: pointer; border: 1px solid var(--border2); background: var(--bg2); color: var(--text); border-radius: var(--radius-sm); padding: 6px 12px; transition: all .15s; }
  button:hover { background: var(--bg3); border-color: #444; }
  button.primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 500; }
  button.primary:hover { opacity: .9; }
  input, textarea, select { font-family: var(--font); font-size: 13px; background: var(--bg2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 10px; outline: none; width: 100%; transition: border-color .15s; }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--bg2); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .badge { display: inline-flex; align-items: center; font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .tag-photopark { background: #14532d; color: #4ade80; }
  .tag-luminati { background: #1e3a5f; color: #60a5fa; }
  .tag-kastekust { background: #451a03; color: #fb923c; }
  .tag-brand { background: #2a2a2a; color: #a3a3a3; }
  .tag-admin { background: #3f0f0f; color: #f87171; }
  .tag- { background: #1a1a1a; color: #555; }
  #layout { display: flex; height: 100vh; overflow: hidden; }
  #sidebar { width: 200px; flex-shrink: 0; background: var(--bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 16px 0; }
  #sidebar-logo { padding: 0 16px 20px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
  #sidebar-logo h1 { font-size: 16px; font-weight: 600; color: var(--text); }
  #sidebar-logo p { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 16px; font-size: 13px; color: var(--text2); cursor: pointer; border-radius: 0; transition: all .15s; border: none; background: transparent; width: 100%; text-align: left; }
  .nav-item:hover { color: var(--text); background: var(--bg2); }
  .nav-item.active { color: var(--accent); background: rgba(232,160,32,.08); border-right: 2px solid var(--accent); }
  .nav-icon { font-size: 15px; width: 18px; text-align: center; }
  #main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  #topbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; background: var(--bg); position: sticky; top: 0; z-index: 10; }
  #topbar-title { font-size: 16px; font-weight: 500; }
  #topbar-meta { font-size: 11px; color: var(--text3); margin-top: 2px; }
  #content { padding: 24px; flex: 1; }
  .section-title { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .grid4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
  .metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-val { font-size: 26px; font-weight: 500; line-height: 1.1; margin-bottom: 4px; }
  .metric-label { font-size: 11px; color: var(--text2); }
  .alert { border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
  .alert-red { background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.2); color: #fca5a5; }
  .alert-amber { background: rgba(232,160,32,.08); border: 1px solid rgba(232,160,32,.2); color: #fcd34d; }
  .alert-green { background: rgba(34,197,94,.08); border: 1px solid rgba(34,197,94,.2); color: #86efac; }
  .alert-blue { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.2); color: #93c5fd; }

  /* TODAY */
  .block-row { display: grid; grid-template-columns: 80px 1fr; gap: 12px; align-items: start; margin-bottom: 6px; }
  .block-time { font-size: 12px; font-weight: 500; padding-top: 2px; }
  .block-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .block-card.active { border-color: var(--accent); background: rgba(232,160,32,.05); }
  .block-card.danger { border-color: rgba(239,68,68,.4); background: rgba(239,68,68,.05); }
  .block-label { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
  .block-note { font-size: 11px; color: var(--text2); line-height: 1.4; margin-bottom: 6px; }
  .block-task-row { display: flex; gap: 6px; align-items: center; }

  /* WEEK */
  .week-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; margin-bottom: 20px; }
  .day-cell { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 8px; cursor: pointer; min-height: 110px; transition: border-color .15s; }
  .day-cell:hover { border-color: #444; }
  .day-cell.today { border-color: var(--accent); background: rgba(232,160,32,.05); }
  .day-cell.selected { border-color: var(--blue); }
  .day-name { font-size: 10px; color: var(--text3); text-align: center; margin-bottom: 3px; }
  .day-num { font-size: 15px; font-weight: 500; text-align: center; margin-bottom: 6px; }
  .day-score { text-align: center; margin-bottom: 4px; }
  .day-task-pill { font-size: 9px; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

  /* HABITS */
  .habit-row { display: grid; grid-template-columns: 200px repeat(7,1fr); gap: 4px; align-items: center; margin-bottom: 5px; }
  .habit-label { font-size: 11px; color: var(--text2); }
  .habit-dot { height: 24px; border-radius: 4px; background: var(--bg2); border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all .15s; }
  .habit-dot.done { background: rgba(34,197,94,.1); border-color: rgba(34,197,94,.3); color: var(--green); }

  /* CHAT */
  #chat-wrap { display: flex; flex-direction: column; height: calc(100vh - 60px); }
  #chat-messages { flex: 1; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 78%; padding: 11px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.65; white-space: pre-wrap; }
  .msg-user { background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.2); color: #bfdbfe; align-self: flex-end; }
  .msg-assistant { background: var(--bg2); border: 1px solid var(--border); color: var(--text); align-self: flex-start; }
  .msg-thinking { color: var(--text3); font-style: italic; font-size: 13px; }
  #chat-input-area { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
  #chat-input-area textarea { resize: none; height: 44px; line-height: 1.4; }

  /* ROADMAP */
  .roadmap-phase { margin-bottom: 24px; }
  .phase-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; padding: 10px 14px; border-radius: var(--radius-sm); cursor: pointer; }
  .phase-content { display: none; }
  .phase-content.open { display: block; }
  .track-section { margin-bottom: 10px; }
  .track-header { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 6px; padding: 4px 0; }
  .step-row { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .step-num { font-size: 11px; color: var(--text3); min-width: 20px; padding-top: 1px; }
  .step-text { font-size: 13px; color: var(--text2); line-height: 1.5; }

  /* TASKS */
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 6px; }
  .task-item.done-item { opacity: .5; }
  .task-cb { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border2); background: transparent; cursor: pointer; flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .task-cb.checked { background: var(--green); border-color: var(--green); }
  .task-text { flex: 1; font-size: 13px; color: var(--text); line-height: 1.4; }

  /* SETTINGS */
  .setting-group { margin-bottom: 24px; }
  .setting-label { font-size: 12px; color: var(--text2); margin-bottom: 6px; display: block; }

  /* SCHEDULE GRID */
  .schedule-table { width: 100%; border-collapse: collapse; }
  .schedule-table th { font-size: 11px; color: var(--text3); font-weight: 500; text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .schedule-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: top; }
  .schedule-table tr:hover td { background: var(--bg2); }
  .track-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }

  @media(max-width:700px){
    #sidebar { display: none; }
    .grid4 { grid-template-columns: 1fr 1fr; }
    .grid2, .grid3 { grid-template-columns: 1fr; }
    .week-grid { grid-template-columns: repeat(4,1fr); }
    .habit-row { grid-template-columns: 130px repeat(7,1fr); }
  }
</style>
</head>

// ─── UTILS ───────────────────────────────────────────────────────────
function today() { return new Date().toISOString().split('T')[0]; }
function getWeekDays(offset=0){
  const d=new Date(); const day=d.getDay()||7;
  d.setDate(d.getDate()-day+1+offset*7);
  return Array.from({length:7},(_,i)=>{ const x=new Date(d); x.setDate(d.getDate()+i); return x; });
}
function formatDate(d){ return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
function formatTime(){ const n=new Date(); return n.getHours().toString().padStart(2,'0')+':'+n.getMinutes().toString().padStart(2,'0'); }
function getCurrentBlock(){
  const now=new Date(); const mins=now.getHours()*60+now.getMinutes();
  const toM=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
  for(let i=0;i<BLOCKS.length;i++){
    const end=i+1<BLOCKS.length?toM(BLOCKS[i+1].time):1440;
    if(mins>=toM(BLOCKS[i].time)&&mins<end) return BLOCKS[i].key||BLOCKS[i].time;
  }
  return null;
}
function initDayData(dk){
  if(!S.weekData[dk]){
    S.weekData[dk]={habits:{},tasks:{}};
    BLOCKS.forEach(b=>{ S.weekData[dk].tasks[b.time]={text:'',track:''}; });
  }
}
function getHabitScore(dk){ return HABITS.filter(h=>S.weekData[dk]?.habits?.[h.id]).length; }

// ─── NAVIGATION ──────────────────────────────────────────────────────
function nav(v){
  S.view=v;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
  const titles={today:'Today',week:'Week',schedule:'Weekly schedule',roadmap:'Roadmap',tasks:'Tasks',journal:'Journal',chat:'Assistant',settings:'Settings'};
  document.getElementById('topbar-title').textContent=titles[v]||v;
  document.getElementById('topbar-meta').textContent=v==='today'?formatDate(new Date()):'';
  document.getElementById('topbar-actions').innerHTML='';
  render();
}

// ─── RENDER ──────────────────────────────────────────────────────────
function render(){
  const el=document.getElementById('content');
  const views={today:renderToday,week:renderWeek,schedule:renderSchedule,roadmap:renderRoadmap,tasks:renderTasks,journal:renderJournal,chat:renderChat,settings:renderSettings};
  el.innerHTML=(views[S.view]||renderToday)();
  afterRender();
}

// ─── TODAY ───────────────────────────────────────────────────────────
function renderToday(){
  const dk=today();
  initDayData(dk);
  const d=S.weekData[dk];
  const goal=S.goals[dk]||'';
  const curBlock=getCurrentBlock();
  const score=getHabitScore(dk);
  const tod=new Date();
  const dayName=tod.toLocaleDateString('en-GB',{weekday:'long'});
  const isMonWed=dayName==='Monday'||dayName==='Wednesday';
  const isTueThu=dayName==='Tuesday'||dayName==='Thursday';
  const focusTrack=isMonWed?'PhotoPARK':isTueThu?'Luminati':dayName==='Friday'?'Review':'—';

  const blocks=BLOCKS.map(bl=>{
    const isCur=bl.time===curBlock;
    const tv=d.tasks[bl.time]||{text:'',track:''};
    const borderColor=bl.type==='danger'?'rgba(239,68,68,.5)':bl.type==='warn'?'rgba(232,160,32,.5)':isCur?'rgba(59,130,246,.4)':'var(--border)';
    const bgColor=bl.type==='danger'?'rgba(239,68,68,.04)':bl.type==='warn'?'rgba(232,160,32,.04)':isCur?'rgba(59,130,246,.04)':'var(--bg2)';
    const timeColor=bl.type==='danger'?'#f87171':bl.type==='warn'?'#fcd34d':isCur?'#93c5fd':'var(--text3)';
    const taskInput=bl.editable?`
      <div class="block-task-row">
        <input value="${(tv.text||'').replace(/"/g,'&quot;')}" onchange="setBlockTask('${dk}','${bl.time}','text',this.value)" placeholder="${bl.type==='warn'?'Write tomorrow\'s tasks here...':'Task for this block...'}" style="flex:1;font-size:12px;" />
        <select onchange="setBlockTask('${dk}','${bl.time}','track',this.value)" style="width:110px;font-size:11px;background:${TRACK_BG[tv.track]};color:${TRACK_COLOR[tv.track]};">
          ${TRACKS.map(t=>`<option value="${t}"${tv.track===t?' selected':''}>${t||'No track'}</option>`).join('')}
        </select>
      </div>`:'';
    const badge=bl.type==='danger'?`<span class="badge" style="background:rgba(239,68,68,.1);color:#f87171;font-size:10px;margin-left:8px;">📵 phone out</span>`:isCur?`<span class="badge" style="background:rgba(59,130,246,.1);color:#93c5fd;font-size:10px;margin-left:8px;">● now</span>`:'';
    return `<div class="block-row">
      <div class="block-time" style="color:${timeColor};">${bl.time}</div>
      <div class="block-card" style="border-color:${borderColor};background:${bgColor};">
        <div class="block-label">${bl.label}${badge}</div>
        <div class="block-note">${bl.note}</div>
        ${tv.text?`<div style="margin-bottom:${bl.editable?'6px':'0'};"><span class="badge tag-${(tv.track||'').toLowerCase().replace(' ','-')}">${tv.track||'task'}: ${tv.text}</span></div>`:''}
        ${taskInput}
      </div>
    </div>`;
  }).join('');

  const habitsHtml=HABITS.map(h=>{
    const done=d.habits[h.id];
    return `<div onclick="toggleTodayHabit('${h.id}')" style="cursor:pointer;padding:9px 12px;background:${done?'rgba(34,197,94,.08)':'var(--bg2)'};border:1px solid ${done?'rgba(34,197,94,.25)':'var(--border)'};border-radius:var(--radius-sm);font-size:12px;color:${done?'#86efac':'var(--text2)'};display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">${done?'✓':'○'}</span>${h.label}
    </div>`;
  }).join('');

  const scoreMsg=score===6?'Perfect day ✦':score>=4?'Strong day':score>=2?'Building...':'Start with one';
  const scoreColor=score===6?'#4ade80':score>=4?'#60a5fa':score>=2?'#f59e0b':'var(--text3)';

  return `
    <div class="alert alert-red" style="display:flex;align-items:center;gap:10px;"><span>📵</span><span><strong>09:15–11:30:</strong> Phone goes in another room. Not silent. Another room. Today's strategic focus: <strong>${focusTrack}</strong></span></div>

    <div style="margin-bottom:20px;">
      <div class="section-title">Today's goal</div>
      <input value="${goal.replace(/"/g,'&quot;')}" onchange="setGoal('${dk}',this.value)" placeholder="What makes today a win? Write one thing." style="font-size:16px;font-weight:500;background:var(--bg2);padding:12px 14px;" />
    </div>

    <div style="margin-bottom:24px;">
      <div class="section-title">Time blocks</div>
      ${blocks}
    </div>

    <div style="margin-bottom:20px;">
      <div class="section-title">Habits — ${score}/${HABITS.length} <span style="color:${scoreColor};margin-left:6px;">${scoreMsg}</span></div>
      <div class="grid2" style="gap:6px;">${habitsHtml}</div>
    </div>
  `;
}

function setGoal(dk,val){ S.goals[dk]=val; persist('goals',S.goals); }
function setBlockTask(dk,time,field,val){ initDayData(dk); S.weekData[dk].tasks[time][field]=val; persist('weekdata',S.weekData); }
function toggleTodayHabit(hid){ const dk=today(); initDayData(dk); S.weekData[dk].habits[hid]=!S.weekData[dk].habits[hid]; persist('weekdata',S.weekData); render(); }

// ─── WEEK ─────────────────────────────────────────────────────────────
function renderWeek(){
  const days=getWeekDays(S.weekOffset);
  const td=today();
  days.forEach(d=>initDayData(d.toISOString().split('T')[0]));

  const dayCells=days.map((day,i)=>{
    const dk=day.toISOString().split('T')[0];
    const isT=dk===td;
    const score=getHabitScore(dk);
    const tasks=Object.entries(S.weekData[dk]?.tasks||{}).filter(([,v])=>v.text).slice(0,4);
    return `<div class="day-cell${isT?' today':''}" onclick="openDayDetail('${dk}')">
      <div class="day-name">${DAYS[i]}</div>
      <div class="day-num" style="color:${isT?'var(--accent)':'var(--text)'};">${day.getDate()}</div>
      ${score>0?`<div class="day-score"><span class="badge" style="background:rgba(34,197,94,.1);color:#4ade80;font-size:9px;">${score}/${HABITS.length}</span></div>`:''}
      ${tasks.map(([,v])=>`<div class="day-task-pill" style="background:${TRACK_BG[v.track]};color:${TRACK_COLOR[v.track]};">${v.text}</div>`).join('')}
    </div>`;
  }).join('');

  const wk=getWeekDays(S.weekOffset);
  const wLabel=`${wk[0].toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${wk[6].toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;

  const habitRows=HABITS.map(h=>`
    <div class="habit-row">
      <div class="habit-label">${h.label}</div>
      ${days.map(day=>{
        const dk=day.toISOString().split('T')[0];
        const done=S.weekData[dk]?.habits?.[h.id];
        return `<div class="habit-dot${done?' done':''}" onclick="toggleWeekHabit('${dk}','${h.id}')">${done?'✓':''}</div>`;
      }).join('')}
    </div>`).join('');

  const dayDetail=S.selectedDayDetail?renderDayDetail(S.selectedDayDetail):'';

  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <div style="font-size:13px;color:var(--text2);">${wLabel}</div>
      <div style="display:flex;gap:6px;">
        <button onclick="weekNav(-1)">‹</button>
        <button onclick="weekNav(0)">This week</button>
        <button onclick="weekNav(1)">›</button>
      </div>
    </div>
    <div class="week-grid">${dayCells}</div>
    <div class="section-title">Habit streak</div>
    ${habitRows}
    ${dayDetail}
  `;
}

function weekNav(v){ S.weekOffset=v===0?0:S.weekOffset+v; S.selectedDayDetail=null; render(); }
function toggleWeekHabit(dk,hid){ initDayData(dk); S.weekData[dk].habits[hid]=!S.weekData[dk].habits[hid]; persist('weekdata',S.weekData); render(); }
function openDayDetail(dk){ S.selectedDayDetail=S.selectedDayDetail===dk?null:dk; render(); }

// ─── TASKS ────────────────────────────────────────────────────────────
function renderTasks(){
  const pending=S.tasks.filter(t=>!t.done);
  const done=S.tasks.filter(t=>t.done);
  const byTrack={};
  TRACKS.filter(t=>t).forEach(t=>{byTrack[t]=pending.filter(task=>task.track===t);});
  const noTrack=pending.filter(t=>!t.track);

  const taskItem=(t)=>`
    <div class="task-item${t.done?' done-item':''}">
      <div class="task-cb${t.done?' checked':''}" onclick="toggleTask(${t.id})">${t.done?'✓':''}</div>
      <div class="task-text">${t.text}</div>
      <span class="badge tag-${(t.track||'').toLowerCase().replace(' ','-')}" style="font-size:10px;flex-shrink:0;">${t.track||'—'}</span>
      <button onclick="deleteTask(${t.id})" style="padding:2px 6px;border:none;background:transparent;color:var(--text3);font-size:16px;">×</button>
    </div>`;

  const trackSections=TRACKS.filter(t=>t).map(t=>{
    const ts=pending.filter(task=>task.track===t);
    if(!ts.length) return '';
    return `<div style="margin-bottom:16px;"><div class="section-title" style="color:${TRACK_COLOR[t]};">${t} (${ts.length})</div>${ts.map(taskItem).join('')}</div>`;
  }).join('');

  return `
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <input id="new-task-input" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addTask()" style="flex:1;" />
      <select id="new-task-track" style="width:120px;">
        ${TRACKS.map(t=>`<option value="${t}">${t||'No track'}</option>`).join('')}
      </select>
      <button class="primary" onclick="addTask()">Add</button>
    </div>
    ${trackSections}
    ${noTrack.length?`<div style="margin-bottom:16px;"><div class="section-title">Untracked (${noTrack.length})</div>${noTrack.map(taskItem).join('')}</div>`:''}
    ${done.length?`<div style="margin-top:20px;"><div class="section-title">Done (${done.length})</div>${done.map(taskItem).join('')}</div>`:''}
    ${S.tasks.length===0?`<div class="card" style="text-align:center;color:var(--text3);padding:40px;">No tasks yet. Add your first one above.</div>`:''}
  `;
}
function addTask(){ const i=document.getElementById('new-task-input'); const tr=document.getElementById('new-task-track'); if(!i.value.trim()) return; S.tasks.push({id:Date.now(),text:i.value.trim(),track:tr.value,done:false}); i.value=''; persist('tasks',S.tasks); render(); }
function toggleTask(id){ const t=S.tasks.find(t=>t.id===id); if(t) t.done=!t.done; persist('tasks',S.tasks); render(); }
function deleteTask(id){ S.tasks=S.tasks.filter(t=>t.id!==id); persist('tasks',S.tasks); render(); }

// ─── CHAT ─────────────────────────────────────────────────────────────
function renderChat(){
  const msgs=S.chatHistory.map(m=>`
    <div class="msg msg-${m.role}">${m.content}</div>`).join('');
  const empty=!S.chatHistory.length?`
    <div class="card" style="max-width:500px;">
      <div style="font-size:15px;font-weight:500;margin-bottom:8px;">Your personal business assistant</div>
      <div style="font-size:13px;color:var(--text2);line-height:1.7;">Your full context is already loaded — the debt, PhotoPARK, Luminati, Kastekust, VEF, the Nordic plan, your daily structure, everything.<br><br>Ask anything. What to work on today. How to pitch VEF. How to message a tester. What to post. How to handle an inquiry.</div>
    </div>`:'';
  return `
    <div id="chat-wrap">
      <div id="chat-messages">${empty}${msgs}<div id="chat-end"></div></div>
      <div id="chat-input-area">
        <textarea id="chat-in" placeholder="Ask your assistant... (Enter to send, Shift+Enter for new line)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat();}"></textarea>
        <button class="primary" onclick="sendChat()" style="height:44px;padding:0 16px;">Send</button>
      </div>
    </div>
  `;

async function sendChat(){
  const inp=document.getElementById('chat-in');
  if(!inp||!inp.value.trim()) return;
  const msg=inp.value.trim(); inp.value='';
  if(!S.settings.apiKey){ alert('Add your Anthropic API key in Settings first.'); return; }
  S.chatHistory.push({role:'user',content:msg});
  persist('chat',S.chatHistory.slice(-60));
  render();
  setTimeout(()=>document.getElementById('chat-end')?.scrollIntoView({behavior:'smooth'}),50);

  const thinking=document.createElement('div');
  thinking.className='msg msg-assistant msg-thinking'; thinking.textContent='Thinking...';
  document.getElementById('chat-messages')?.appendChild(thinking);

  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:SYSTEM_PROMPT,messages:S.chatHistory.map(m=>({role:m.role,content:m.content}))})
    });
    const data=await res.json();
    const reply=data.content?.map(b=>b.text||'').join('')||data.error?.message||'Error.';
    S.chatHistory.push({role:'assistant',content:reply});
    persist('chat',S.chatHistory.slice(-60));
  } catch(e){
    S.chatHistory.push({role:'assistant',content:'Connection error. Check your API key in Settings.'});
    persist('chat',S.chatHistory.slice(-60));
  }
  render();
  setTimeout(()=>document.getElementById('chat-end')?.scrollIntoView({behavior:'smooth'}),50);
}

          <button onclick="sendTelegram('☀️ *Morning brief*\\nGoal: ${(S.goals[today()]||'not set').replace(/'/g,'\\\'')}')" style="text-align:left;">Morning brief</button>
          <button onclick="sendTelegram('🌙 *End of day*\\nGoal was: ${(S.goals[today()]||'not set').replace(/'/g,'\\\'')}')" style="text-align:left;">End of day</button>
          <button onclick="sendTelegram('📋 *Task update*\\nOpen: ${S.tasks.filter(t=>!t.done).length}\\nDone: ${S.tasks.filter(t=>t.done).length}')" style="text-align:left;">Task progress</button>
        </div>
      </div>

      <div class="card">
        <div class="section-title">Clear chat history</div>
        <button onclick="if(confirm('Clear all chat history?')){S.chatHistory=[];persist('chat',S.chatHistory);alert('Cleared.');}">Clear history</button>
      </div>
    </div>
  `;
}
function saveSettings(){ S.settings={apiKey:document.getElementById('s-apikey')?.value||'',tgToken:document.getElementById('s-tgtoken')?.value||'',tgChatId:document.getElementById('s-tgchat')?.value||''}; persist('settings',S.settings); alert('Saved.'); }

// ─── TELEGRAM ─────────────────────────────────────────────────────────
async function sendTelegram(msg){
  const {tgToken:tok,tgChatId:cid}=S.settings;
  if(!tok||!cid){ alert('Add Telegram token & chat ID in Settings first.'); return; }
  try{
    const r=await fetch(`https://api.telegram.org/bot${tok}/sendMessage`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:cid,text:msg,parse_mode:'Markdown'})});
    const d=await r.json(); d.ok?alert('Sent to Telegram ✓'):alert('Error: '+d.description);
  } catch{ alert('Telegram failed. Check your token & chat ID.'); }
}

// ─── AFTER RENDER ─────────────────────────────────────────────────────
function afterRender(){
  if(S.view==='chat'){
    setTimeout(()=>document.getElementById('chat-end')?.scrollIntoView({behavior:'instant'}),30);
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────
document.getElementById('sidebar-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
document.getElementById('topbar-meta').textContent=formatDate(new Date());

window.nav=nav; window.weekNav=weekNav; window.toggleWeekHabit=toggleWeekHabit;
window.openDayDetail=openDayDetail; window.togglePhase=togglePhase;
window.addTask=addTask; window.toggleTask=toggleTask; window.deleteTask=deleteTask;
window.setGoal=setGoal; window.setBlockTask=setBlockTask; window.toggleTodayHabit=toggleTodayHabit;
window.saveJournal=saveJournal; window.sendJournalTg=sendJournalTg;
window.sendChat=sendChat; window.saveSettings=saveSettings; window.sendTelegram=sendTelegram;

render();
</script>
</body>
